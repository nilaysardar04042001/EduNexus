<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/EduNexus.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const storedScheme = localStorage.getItem('color-scheme');
        if (storedScheme === 'light' || storedScheme === 'dark') {
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = storedScheme;
        }
      } catch {}
    </script>
    <meta
      name="description"
      content="EduNexus — Learn, Practice, Create, Excel. Modern learning and practice platform."
    />
    <title>EduNexus — Learn • Practice • Create • Excel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
